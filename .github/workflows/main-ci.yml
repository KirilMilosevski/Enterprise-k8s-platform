# Main branch validation workflow.
# Validates repository configuration and infrastructure on pushes to main by:
# linting YAML and Dockerfiles when present, validating local Helm/Terraform content
# when present, and always running Gitleaks, Checkov, and Trivy scans.

name: Main CI

"on":
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate And Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect repository content
        id: detect
        run: |
          set -euo pipefail

          has_yaml=false
          has_dockerfiles=false
          has_helm_charts=false
          has_helm_values=false
          has_terraform=false

          if find . -type f \( -name '*.yaml' -o -name '*.yml' \) -print -quit | grep -q .; then
            has_yaml=true
          fi

          if find . -type f \( -iname 'Dockerfile' -o -iname 'Dockerfile.*' -o -iname '*.dockerfile' \) -print -quit | grep -q .; then
            has_dockerfiles=true
          fi

          if find . -type f -name 'Chart.yaml' -print -quit | grep -q .; then
            has_helm_charts=true
          fi

          if find . -type f \( -iname 'values.yaml' -o -iname 'values.yml' -o -iname 'values-*.yaml' -o -iname 'values-*.yml' -o -iname '*values.yaml' -o -iname '*values.yml' \) -print -quit | grep -q .; then
            has_helm_values=true
          fi

          if find . -type f -name '*.tf' -print -quit | grep -q .; then
            has_terraform=true
          fi

          echo "yaml=${has_yaml}" >> "${GITHUB_OUTPUT}"
          echo "dockerfiles=${has_dockerfiles}" >> "${GITHUB_OUTPUT}"
          echo "helm_charts=${has_helm_charts}" >> "${GITHUB_OUTPUT}"
          echo "helm_values=${has_helm_values}" >> "${GITHUB_OUTPUT}"
          echo "terraform=${has_terraform}" >> "${GITHUB_OUTPUT}"

      - name: Set up Python for YAML tooling
        if: steps.detect.outputs.yaml == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install yamllint
        if: steps.detect.outputs.yaml == 'true'
        run: python -m pip install --upgrade pip yamllint

      - name: Lint YAML files
        if: steps.detect.outputs.yaml == 'true'
        run: |
          set -euo pipefail

          cat > .yamllint-ci.yml <<'YAML'
          extends: default
          rules:
            document-start: disable
            line-length: disable
          YAML

          mapfile -d '' -t yaml_files < <(find . -type f \( -name '*.yaml' -o -name '*.yml' \) -print0)
          yamllint -s -c .yamllint-ci.yml "${yaml_files[@]}"

      - name: Lint Dockerfiles
        if: steps.detect.outputs.dockerfiles == 'true'
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          recursive: true

      - name: Set up Helm
        if: steps.detect.outputs.helm_charts == 'true'
        uses: azure/setup-helm@v4.3.0
        with:
          version: v3.18.3

      - name: Lint and render local Helm charts
        if: steps.detect.outputs.helm_charts == 'true'
        run: |
          set -euo pipefail

          mapfile -t chart_dirs < <(find . -type f -name 'Chart.yaml' -exec dirname {} \; | sort -u)

          for chart_dir in "${chart_dirs[@]}"; do
            echo "Linting chart: ${chart_dir}"
            helm lint "${chart_dir}"
            helm template "$(basename "${chart_dir}")" "${chart_dir}" >/dev/null
          done

      - name: Note Helm values without local charts
        if: steps.detect.outputs.helm_charts != 'true' && steps.detect.outputs.helm_values == 'true'
        run: |
          echo "Helm values files exist, but no local Chart.yaml files were found."
          echo "Skipping local helm lint/template because this repository stores Helm values inline in ArgoCD manifests."

      - name: Set up Terraform
        if: steps.detect.outputs.terraform == 'true'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Check Terraform formatting
        if: steps.detect.outputs.terraform == 'true'
        run: terraform fmt -check -diff -recursive .

      - name: Validate Terraform configuration
        if: steps.detect.outputs.terraform == 'true'
        env:
          TF_IN_AUTOMATION: 'true'
        run: |
          set -euo pipefail

          mapfile -t tf_dirs < <(find . -type f -name '*.tf' -exec dirname {} \; | sort -u)

          for tf_dir in "${tf_dirs[@]}"; do
            echo "Validating Terraform in ${tf_dir}"
            terraform -chdir="${tf_dir}" init -backend=false -input=false
            terraform -chdir="${tf_dir}" validate
          done

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          config_file: .checkov.yml
          quiet: true

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.33.1
        with:
          scan-type: fs
          scan-ref: .
          hide-progress: true
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: '1'
